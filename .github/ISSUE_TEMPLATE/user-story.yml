name: User story
description: A player-facing feature slice. Usually created by /stories from docs/GAME_DESIGN.md.
title: "[Story] "
labels: ["type:story", "status:backlog"]
body:
  - type: input
    id: story-id
    attributes:
      label: Story ID
      description: Stable ID used by the sync script to avoid duplicates (for example EW-COMBAT-003).
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      value: |
        As a <player type>,
        I want <capability>,
        so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given/When/Then. Each one becomes at least one test.
      value: |
        - [ ] Given ..., when ..., then ...
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: Controls which models plan and help (see docs/AI_WORKFLOW.md).
      options: [low, medium, high]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [combat, progression, items, world, quests, net, ui, ci, docs, art, tools]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Files and assemblies in scope
      description: Paths the builder may touch.
  - type: textarea
    id: skills
    attributes:
      label: Skills and lessons to load
      description: For example emberwright-tdd, ngo-host-authority, lesson 004.
  - type: textarea
    id: deps
    attributes:
      label: Depends on
      description: Issue numbers that must be closed first (for example "#12, #15").
