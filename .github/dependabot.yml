version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /Tests
    schedule:
      interval: weekly
    ignore:
      # Unity Test Framework ships NUnit 3; Core tests must stay portable into Unity.
      - dependency-name: NUnit
        update-types: ["version-update:semver-major"]
